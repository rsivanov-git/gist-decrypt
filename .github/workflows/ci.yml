name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm test
      - name: Validate Docker build
        run: docker build -t gist-decrypt:ci .
      - name: Validate Compose
        env:
          GIST_URL: https://gist.githubusercontent.com/example/abcdef/raw/Proxy-List.txt
          PROXY_ENCRYPTION_KEY: test-placeholder
        run: docker compose config --quiet
